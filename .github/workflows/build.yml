# Builds, tests and packages the engine as it ships, then uses the archive as a person
# would - with the pinned GCC and the pinned Clang, on Linux and on Windows, every run
# the same steps. All four archives are a release (release.yml), so a person picks the
# compiler. Called by ci.yml on every push and by release.yml on every version tag.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build (default: the one that triggered the run)"
        type: string
        default: ""

env:
  # The pinned tools, fetched once and cached per pin file.
  VKM_TOOLS_DIR: ${{ github.workspace }}/../vkm-tools
  # Every compile goes through ccache, whose store a run carries from its last one.
  CCACHE_DIR: ${{ github.workspace }}/../ccache
  CCACHE_MAXSIZE: 1500M
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_WINDOWS_URL: https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
  CCACHE_WINDOWS_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4

jobs:
  build:
    name: ${{ matrix.label }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for its older glibc: what the SDK is built against is the oldest it runs on.
        include:
          - { compiler: gcc,   label: GCC,   platform: linux-x64,   runner: ubuntu-22.04, python: python3, archive: tar.xz }
          - { compiler: clang, label: Clang, platform: linux-x64,   runner: ubuntu-22.04, python: python3, archive: tar.xz }
          - { compiler: gcc,   label: GCC,   platform: windows-x64, runner: windows-2022, python: python,  archive: zip }
          - { compiler: clang, label: Clang, platform: windows-x64, runner: windows-2022, python: python,  archive: zip }
    defaults:
      run:
        shell: bash
    steps:
      # The tree's bytes as they are on Linux: shaders and data are compared and hashed.
      - name: Keep line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/cache@v6
        with:
          path: ${{ env.VKM_TOOLS_DIR }}
          key: vkm-tools-${{ matrix.platform }}-${{ hashFiles('tools/toolchain.json') }}

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.compiler }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-${{ matrix.platform }}-

      - name: Install ccache and the window system's headers
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            curl -sSfL -o ccache.zip "$CCACHE_WINDOWS_URL"
            echo "$CCACHE_WINDOWS_SHA256  ccache.zip" | sha256sum -c -
            unzip -q ccache.zip -d "$RUNNER_TEMP"
            cygpath -w "$(ls -d "$RUNNER_TEMP"/ccache-*)" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ccache \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
              libwayland-dev libxkbcommon-dev wayland-protocols \
              libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev
          fi

      # CMake, Ninja and Python, as every SDK user gets them; the configures below fetch
      # the pinned compiler VKM_COMPILER names (cmake/pinned_toolchain.cmake).
      - name: Fetch the pinned tools
        run: ${{ matrix.python }} tools/vkm.py toolchain cmake ninja python --path >> "$GITHUB_PATH"

      - name: Build the shipping engine
        run: |
          cmake -B build-shipping -G Ninja -DVKM_SHIPPING=ON -DVKM_COMPILER=${{ matrix.compiler }}
          cmake --build build-shipping --target vkm_runtime_app vkm_server_app

      - name: Build the SDK
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVKM_COMPILER=${{ matrix.compiler }} \
            -DVKM_SHIPPING_ENGINE:PATH="$GITHUB_WORKSPACE/build-shipping" \
            -DVKM_PYTHON:PATH="$(${{ matrix.python }} tools/vkm.py toolchain python --dir)"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: What the compiler cache saved
        run: ccache --show-stats

      - name: Package
        run: cmake --build build --target package

      # The archive as a person gets it: unpacked somewhere else, a project made, built and packaged.
      - name: Use the SDK
        run: |
          work="$RUNNER_TEMP/use-the-sdk"
          mkdir -p "$work"
          # The pinned Python, on PATH since the tools step, reads either archive.
          ${{ matrix.python }} -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])" \
            build/vkmEngine-*.${{ matrix.archive }} "$work"
          sdk="$(ls -d "$work"/vkmEngine-*)"
          cd "$work"
          "$sdk/vkm" --version
          "$sdk/vkm" new game
          "$sdk/vkm" new lab -t physics_lab
          "$sdk/vkm" doctor game
          "$sdk/vkm" package game
          "$sdk/vkm" package lab
          ls game/dist lab/dist

      - name: Use the SDK from cmd.exe
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /d %%d in ("%RUNNER_TEMP%\use-the-sdk\vkmEngine-*") do call "%%d\vkm.cmd" --version

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.compiler }}-${{ matrix.platform }}
          path: build/vkmEngine-*.${{ matrix.archive }}
          if-no-files-found: error
