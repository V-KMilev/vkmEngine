# Builds and tests the engine the way it ships, on Linux and Windows: the SDK with the
# GCC tools/toolchain.json pins, then the archive itself, used as a person uses it. And a
# Clang build of the same tree, which ships nothing and catches what GCC lets through.
# Called by ci.yml on every push and by release.yml on every version tag.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build (default: the one that triggered the run)"
        type: string
        default: ""

env:
  # The pinned tools, fetched once and cached per pin file.
  VKM_TOOLS_DIR: ${{ github.workspace }}/../vkm-tools
  # Every compile goes through ccache, whose store a job carries from its last run.
  CCACHE_DIR: ${{ github.workspace }}/../ccache
  CCACHE_MAXSIZE: 1500M
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_WINDOWS_URL: https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
  CCACHE_WINDOWS_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4

jobs:
  sdk:
    name: SDK (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for its older glibc: what the SDK is built against is the oldest it runs on.
          - platform: linux-x64
            runner: ubuntu-22.04
            python: python3
            archive: tar.xz
          - platform: windows-x64
            runner: windows-2022
            python: python
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      # The tree's bytes as they are on Linux: shaders and data are compared and hashed.
      - name: Keep line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/cache@v6
        with:
          path: ${{ env.VKM_TOOLS_DIR }}
          key: vkm-tools-${{ matrix.platform }}-${{ hashFiles('tools/toolchain.json') }}

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.platform }}-

      # Linux's comes with the system packages below.
      - name: Install ccache
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o ccache.zip "$CCACHE_WINDOWS_URL"
          echo "$CCACHE_WINDOWS_SHA256  ccache.zip" | sha256sum -c -
          unzip -q ccache.zip -d "$RUNNER_TEMP"
          cygpath -w "$(ls -d "$RUNNER_TEMP"/ccache-*)" >> "$GITHUB_PATH"

      - name: Install the window system's headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev

      # GCC, CMake, Ninja and Python, as every SDK user gets them.
      - name: Fetch the pinned toolchain
        run: ${{ matrix.python }} tools/vkm.py toolchain gcc cmake ninja python --path >> "$GITHUB_PATH"

      - name: Build the shipping engine
        run: |
          cmake -B build-shipping -G Ninja -DVKM_SHIPPING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build-shipping --target vkm_runtime_app vkm_server_app

      - name: Build the SDK
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DVKM_SHIPPING_ENGINE:PATH="$GITHUB_WORKSPACE/build-shipping" \
            -DVKM_PYTHON:PATH="$(${{ matrix.python }} tools/vkm.py toolchain python --dir)"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: What the compiler cache saved
        run: ccache --show-stats

      - name: Package
        run: cmake --build build --target package

      # The archive as a person gets it: unpacked somewhere else, a project made, built and packaged.
      - name: Use the SDK
        run: |
          work="$RUNNER_TEMP/use-the-sdk"
          mkdir -p "$work"
          # The pinned Python, on PATH since the toolchain step, reads either archive.
          ${{ matrix.python }} -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])" \
            build/vkmEngine-*.${{ matrix.archive }} "$work"
          sdk="$(ls -d "$work"/vkmEngine-*)"
          cd "$work"
          "$sdk/vkm" --version
          "$sdk/vkm" new game
          "$sdk/vkm" new lab -t physics_lab
          "$sdk/vkm" doctor game
          "$sdk/vkm" package game
          "$sdk/vkm" package lab
          ls game/dist lab/dist

      - name: Use the SDK from cmd.exe
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /d %%d in ("%RUNNER_TEMP%\use-the-sdk\vkmEngine-*") do call "%%d\vkm.cmd" --version

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.platform }}
          path: build/vkmEngine-*.${{ matrix.archive }}
          if-no-files-found: error

  clang:
    name: Clang (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            python: python3
          - platform: windows-x64
            runner: windows-2022
            python: python
    defaults:
      run:
        shell: bash
    env:
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip
      LLVM_MINGW_SHA256: e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666
    steps:
      - name: Keep line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/cache@v6
        with:
          path: ${{ env.VKM_TOOLS_DIR }}
          key: vkm-tools-${{ matrix.platform }}-${{ hashFiles('tools/toolchain.json') }}

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.platform }}-

      # Linux's comes with the system packages below.
      - name: Install ccache
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o ccache.zip "$CCACHE_WINDOWS_URL"
          echo "$CCACHE_WINDOWS_SHA256  ccache.zip" | sha256sum -c -
          unzip -q ccache.zip -d "$RUNNER_TEMP"
          cygpath -w "$(ls -d "$RUNNER_TEMP"/ccache-*)" >> "$GITHUB_PATH"

      - name: Install Clang and the window system's headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 ccache \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: Install llvm-mingw
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o llvm-mingw.zip "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.zip" | sha256sum -c -
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP"
          cygpath -w "$(ls -d "$RUNNER_TEMP"/llvm-mingw-*)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Fetch the pinned CMake and Ninja
        run: ${{ matrix.python }} tools/vkm.py toolchain cmake ninja --path >> "$GITHUB_PATH"

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: What the compiler cache saved
        run: ccache --show-stats
