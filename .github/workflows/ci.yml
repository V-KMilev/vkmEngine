# build.yml, all of it, on a branch, run by hand (Actions > CI > Run workflow). Nothing runs
# it on a push: a version tag runs release.yml, which builds the same first.
name: CI

on:
  workflow_dispatch:

# A newer run on the same branch makes the running one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
